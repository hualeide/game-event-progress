# Fly.io — https://fly.io/docs/reference/configuration/
# 首次：fly launch（可沿用本文件）→ fly deploy

app = "game-event-progress"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  UPDATE_INTERVAL_HOURS = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
